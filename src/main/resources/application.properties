relationship.between.users.query=MATCH (a:userV3)-[r:connect]-(b:userV3) WHERE a.userId = $fromUser \
  AND b.userId = $toUser RETURN CASE WHEN r.status = 'Pending' AND (a)-[r]->(b) THEN 'Pending' \
  WHEN r.status = 'Pending' AND (a)<-[r]-(b) THEN 'Received' WHEN r.status = 'Blocked' \
  AND (a)-[r]->(b) THEN 'Blocked Outgoing' WHEN r.status = 'Blocked' AND (a)<-[r]-(b) THEN \
  'Blocked Incoming' ELSE r.status END AS status, r.createdAt AS createdAt, r.updatedAt AS updatedAt LIMIT 1
recommendation.users.designation.query=MATCH (u1:userV3 {userId: $userId}) WITH u1 MATCH (u2:userV3) WHERE \
  ( (u2.organisationId = u1.organisationId AND u2.userId <> u1.userId) OR (u2.designation = u1.designation AND \
  u2.organisationId <> u1.organisationId AND u2.userId <> u1.userId) ) AND NOT (u1)-[:connect {status: 'Pending'}]-(u2) \
  AND NOT (u1)-[:connect {status: 'Approved'}]-(u2) AND NOT (u1)-[:connect {status: 'Blocked'}]-(u2) OPTIONAL MATCH (u1)-[r]-(u2) \
  RETURN u2.userId AS userId, u2.organisationId AS organisationId, u2.designation AS designation, u2.role AS role SKIP $offset LIMIT $size
recommendation.mentors.query=MATCH (u1:userV3 {userId: $userId}) MATCH (u2:userV3) WHERE u2.userId <> u1.userId \
  AND 'MENTOR' IN u2.role AND NOT (u1)-[:connect {status: 'Pending'}]-(u2) AND NOT (u1)-[:connect {status: 'Approved'}]-(u2) \
  AND NOT (u1)-[:connect {status: 'Blocked'}]-(u2) OPTIONAL MATCH (u1)-[r]-(u2) RETURN \
  u2.userId as userId, u2.organisationId as organisationId, u2.designation as designation, u2.role as role, \
  CASE WHEN u2.organisationId = u1.organisationId THEN 0 ELSE 1 END AS orgPriority ORDER BY orgPriority ASC SKIP $offset LIMIT $size
blocked.users.query=MATCH (u:userV3)-[r:connect]->(blocked:userV3) WHERE u.userId = $userId AND r.status IN ['blocked','Blocked'] \
  RETURN u.userId AS userId, u.designation AS designation, u.organisationId AS organisationId, blocked.userId \
  AS blockedUserId, blocked.designation AS blockedUserDesignation, blocked.organisationId AS blockedOrganisationId, \
  r.status AS connectionStatus, r.createdAt AS createdAt, r.updatedAt AS updatedAt SKIP $offset LIMIT $size
recommended.users.count.query=MATCH (u1:userV3 {userId: $userId}) WITH u1 MATCH (u2:userV3) WHERE u2.userId <> u1.userId \
  AND ( (u2.organisationId = u1.organisationId) OR (u2.designation = u1.designation AND u2.organisationId <> u1.organisationId) ) \
  WITH u1, u2 OPTIONAL MATCH (u1)-[c:connect]-(u2) WHERE c.status IN ['Pending', 'Approved', 'Blocked'] WITH u2, c WHERE c \
  IS NULL RETURN count(u2) AS totalCount
recommended.mentors.count.query=MATCH (u1:userV3 {userId: $userId}) MATCH (u2:userV3) WHERE u2.userId <> u1.userId AND \
  'MENTOR' IN u2.role AND NOT (u1)-[:connect {status: 'Pending'}]-(u2) AND NOT (u1)-[:connect {status: 'Approved'}]-(u2) \
  AND NOT (u1)-[:connect {status: 'Blocked'}]-(u2) OPTIONAL MATCH (u1)-[r]-(u2) RETURN count(u2) AS totalCount
connections.status.count.query=MATCH (u:userV3)-[r:connect]-(other:userV3) WHERE u.userId = $userId AND r.status IN $statusValue \
  RETURN u.userId AS userId, CASE WHEN r.status = 'Pending' AND (u)-[r]->(other) THEN 'Requested' WHEN r.status = 'Pending' AND (u)<-[r]-(other) \
  THEN 'Received' WHEN r.status = 'Blocked' AND (u)-[r]->(other) THEN 'Blocked Outgoing' ELSE r.status END AS status, count(*) AS count ORDER BY u.userId, status
connections.outgoing.count.query=MATCH (u:userV3)-[r:connect]->(other:userV3) WHERE u.userId = $userId AND r.status = $status RETURN COUNT(r) AS count
connections.incoming.count.query=MATCH (other:userV3)-[r:connect]->(u:userV3) WHERE u.userId = $userId AND r.status = $status RETURN COUNT(r) AS count
connections.both.count.query=MATCH (u:userV3)-[r:connect]-(other:userV3) WHERE u.userId = $userId AND r.status = $status RETURN COUNT(r) AS count